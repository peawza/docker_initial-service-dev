server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: debug-api-file
    static_configs:
      - targets:
          - localhost
        labels:
          job: debug-api
          __path__: /var/log/app/app.log
    pipeline_stages:
      - json:
          expressions:
            Timestamp: Timestamp
            Level: Level
            Message: Message
            Path: Path
            Method: Method
            StatusCode: StatusCode
            Exception: Exception
            trace_id: trace_id
            span_id: span_id
            service: service
      - labels:
          Level:
          Method:
          StatusCode:
          service:
      - timestamp:
          source: Timestamp
          format: RFC3339
