<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match docker.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  user elastic
  password elastic123
  logstash_format true
  logstash_prefix fluentd
  include_tag_key true
  type_name _doc
</match>

<match **>
  @type stdout
</match>
