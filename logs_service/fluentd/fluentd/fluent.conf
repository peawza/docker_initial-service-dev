<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match docker.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  user elastic
  password "#{ENV['ELASTIC_PASSWORD']}"
  logstash_format true
  logstash_prefix fluentd
  include_tag_key true
  suppress_type_name true

  <buffer>
    flush_thread_count 2
    flush_interval 5s
    chunk_limit_size 2M
    queue_limit_length 32
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match **>
  @type stdout
</match>
