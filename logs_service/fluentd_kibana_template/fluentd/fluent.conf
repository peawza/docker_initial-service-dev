<source>
  @type forward
  bind 0.0.0.0
  port 24224
</source>

# Parse JSON API logs when the app writes JSON lines.
<filter docker.api.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

<match docker.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  scheme http
  user "#{ENV['FLUENTD_ES_USER']}"
  password "#{ENV['FLUENTD_ES_PASSWORD']}"
  logstash_format true
  logstash_prefix fluentd-template
  include_tag_key true
  tag_key tag
  suppress_type_name true

  <buffer>
    flush_thread_count 2
    flush_interval 5s
    chunk_limit_size 2M
    queue_limit_length 32
    retry_max_interval 30
    retry_forever true
  </buffer>
</match>

<match **>
  @type stdout
</match>
