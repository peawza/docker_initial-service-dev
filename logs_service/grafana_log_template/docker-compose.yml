version: "3.9"

services:
  loki:
    image: grafana/loki:2.9.8
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    restart: always

  promtail:
    image: grafana/promtail:2.9.8
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./simulator/logs:/var/log/sim:ro
    depends_on:
      - loki
    restart: always

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: always

  api_log_simulator:
    image: python:3.12-alpine
    command: ["python", "-u", "/simulator/api_log_simulator.py"]
    volumes:
      - ./simulator/api_log_simulator.py:/simulator/api_log_simulator.py:ro
      - ./simulator/logs:/simulator/logs
    restart: always

  linux_log_simulator:
    image: python:3.12-alpine
    command: ["python", "-u", "/simulator/linux_log_simulator.py"]
    volumes:
      - ./simulator/linux_log_simulator.py:/simulator/linux_log_simulator.py:ro
      - ./simulator/logs:/simulator/logs
    restart: always
